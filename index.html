<!--

<style>
/* src/shell/tokens.css: the ONE token file (SPEC-v3.31-build-pipeline-and-tokens.md clause 4.1).
   The composition inlines it verbatim at the top of the page's one <style>, ahead of ui.css, the shell's
   own CSS and the legacy CSS still in budget-app.html. Four blocks: light :root, automatic dark (guarded so
   an explicit light choice wins), explicit dark, explicit light. Plain characters only.
   Brand (D-P4-3, the brand guideline): navy 1D1660, Electric Blue 00B5EF, Pink E34397, Orange F9A54E; controls
   are Electric Blue on Navy (the accent: navy with white text on light, Electric Blue with navy text on dark).
   The "Ledger" logo gradient and its violet stop are a brand asset and are NOT recoloured (brand/README.md). */
  :root{
    --navy:#1D1660; --blue:#00B5EF; --pink:#E34397; --orange:#F9A54E; --violet:#4E4A9E;
    --brand-grad:linear-gradient(45deg,#F58A46 0%,#EC2C86 35%,#4E4A9E 68%,#29ABE2 100%);
    --bg:#F5F5FA; --surface:#FFFFFF; --surface-2:#FAFAFE; --ink:#1A1638; --muted:#6A6790;
    --line:#E5E3F0; --line-strong:#D2CFE4; --accent:#1D1660; --accent-ink:#FFFFFF; --accent-soft:#ECEAF7;
    --pos:#12886A; --neg:#D64550; --pos-soft:#E1F4EE; --neg-soft:#FBE7E9; --neg-strong:#BF3540;
    --warn:#9A6B00; --warn-soft:#FDEFC0; --warn-bar:#D99A00; --ink-on-fill:#FFFFFF;
    --shadow:0 1px 2px rgba(36,28,92,.06),0 8px 24px rgba(36,28,92,.06);
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px;
    --text-xs:11px; --text-sm:12.5px; --text-md:14px; --text-lg:16px; --text-xl:19px; --text-2xl:23px;
    --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px; --r:var(--r-md);
    --z-base:0; --z-sticky:10; --z-pop:40; --z-modal:50; --z-toast:60;
    --f:"Roboto",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --row-compact:28px; --row-comfortable:36px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14112E; --surface:#1E1A42; --surface-2:#272254; --ink:#ECEAF8; --muted:#A9A6C8;
      --line:#332C63; --line-strong:#443C7C; --accent:#00B5EF; --accent-ink:#1D1660; --accent-soft:#2A2560;
      --pos:#43C99B; --neg:#F0757F; --pos-soft:#123A30; --neg-soft:#3A1B20; --neg-strong:#F0757F;
      --warn:#F4C65A; --warn-soft:#4A3A12; --warn-bar:#D99A00;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14112E; --surface:#1E1A42; --surface-2:#272254; --ink:#ECEAF8; --muted:#A9A6C8;
    --line:#332C63; --line-strong:#443C7C; --accent:#00B5EF; --accent-ink:#1D1660; --accent-soft:#2A2560;
    --pos:#43C99B; --neg:#F0757F; --pos-soft:#123A30; --neg-soft:#3A1B20; --neg-strong:#F0757F;
    --warn:#F4C65A; --warn-soft:#4A3A12; --warn-bar:#D99A00;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#F5F5FA; --surface:#FFFFFF; --surface-2:#FAFAFE; --ink:#1A1638; --muted:#6A6790;
    --line:#E5E3F0; --line-strong:#D2CFE4; --accent:#1D1660; --accent-ink:#FFFFFF; --accent-soft:#ECEAF7;
    --pos:#12886A; --neg:#D64550; --pos-soft:#E1F4EE; --neg-soft:#FBE7E9; --neg-strong:#BF3540;
    --warn:#9A6B00; --warn-soft:#FDEFC0; --warn-bar:#D99A00;
    --shadow:0 1px 2px rgba(36,28,92,.06),0 8px 24px rgba(36,28,92,.06);
  }

/* src/shell/ui.css: the shared component CSS (SPEC-v3.31-build-pipeline-and-tokens.md clause 4.2). The
   rules the parent's clause 3.1 names, moved out of budget-app.html's inline style in their source order,
   with the scale TABLE of clause 4.2 applied (font sizes to --text-*, padding, margin and gap to --space-*,
   radii to --r-*, the two z-indexes to --z-*) and no literal colour (clause 4.3). 0, 1px, 2px, auto, a
   negative value and 50% are not spacing and stay; weights are not changed in S0. build-deploy.mjs refuses a
   font-size, padding, margin, gap or border-radius value here that is not a scale step or one of those.
   The composition places this file after tokens.css and BEFORE the legacy CSS, so a legacy rule of equal
   specificity that used to come before one of these now comes after it (the cascade audit is in the
   v3.31 hand-back). Plain characters only. */
  .btn{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);
    border-radius:var(--r-sm);padding:var(--space-2) var(--space-3);font:inherit;font-size:var(--text-md);cursor:pointer;line-height:1}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:var(--space-1);gap:2px;box-shadow:var(--shadow)}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:var(--text-md);font-weight:600;
    padding:var(--space-2) var(--space-3);border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .seg.small button{padding:var(--space-2) var(--space-3);font-size:var(--text-sm)}
  .lbl{font-size:var(--text-xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-3);margin-bottom:var(--space-5)}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--space-4) var(--space-4);box-shadow:var(--shadow)}
  .kpi .k{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-size:var(--text-2xl);font-weight:750;margin-top:var(--space-2);letter-spacing:-.02em}
  .kpi .m{font-size:var(--text-sm);color:var(--muted);margin-top:var(--space-1)}
  /* v3.27 (V3.1): FOUR tiles above the grid. .kpis is a five-column grid; the headline strip is four,
     so it says four rather than inheriting five and leaving a hole. */
  .kpis.kpis4{grid-template-columns:repeat(4,1fr)}
  /* A12: ZERO, EMPTY, LOADING and FAILED are four different facts and a tile has to say which.
     A zero is a number and stays a number; these three are not numbers and do not pretend to be. */
  .kpi.k-empty .v,.kpi.k-loading .v{color:var(--muted);font-weight:600}
  .kpi.k-failed .v{color:var(--neg);font-size:var(--text-lg);font-weight:700}
  .kpi.k-loading .v{font-size:var(--text-lg)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .phead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);padding:var(--space-4) var(--space-4) var(--space-2)}
  .ptitle{font-size:var(--text-md);font-weight:700}
  .phint{font-size:var(--text-sm);color:var(--muted)}
  .pbody{padding:var(--space-2) var(--space-4) var(--space-4)}
  .minput{width:98px;text-align:right;font:inherit;font-size:var(--text-md);color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:var(--space-1) var(--space-2)}
  .minput:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .phead .btn{align-self:center;white-space:nowrap}
  .pill{display:inline-block;padding:2px var(--space-2);border-radius:var(--r-pill);font-size:var(--text-sm);font-weight:700}
  .pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .wizback{position:fixed;inset:0;background:rgba(12,14,28,.55);backdrop-filter:blur(3px);z-index:var(--z-modal);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:var(--space-7) var(--space-4)}
  .wiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:min(760px,100%);box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
  .wiz .wh{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--space-3)}
  .wiz .wh .wt{font-weight:800;font-size:var(--text-lg)} .wiz .wh .wsub{color:var(--muted);font-size:var(--text-sm)}
  .wsteps{display:flex;gap:var(--space-2);margin-left:auto} .wstep{width:22px;height:6px;border-radius:var(--r-xs);background:var(--line)} .wstep.on{background:var(--accent)}
  .wiz .wb{padding:var(--space-5) var(--space-5);max-height:64vh;overflow:auto} .wiz .wf{padding:var(--space-4) var(--space-5);border-top:1px solid var(--line);display:flex;gap:var(--space-3);align-items:center}
  .wiz label{display:block;font-size:var(--text-xs);font-weight:700;color:var(--muted);margin:0 0 var(--space-1) 2px;text-transform:uppercase;letter-spacing:.3px}
  .wiz .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)} .wiz .wgrid.g3{grid-template-columns:1fr 1fr 1fr}
  .wiz .wgrid.g4{grid-template-columns:1fr 1fr 1fr 1fr}
  .wiz input.werr,.wiz select.werr{border-color:var(--neg);background:var(--neg-soft)}
  .wiz input,.wiz select{width:100%;padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);font:inherit;font-size:var(--text-md)}
  .invtoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:var(--z-toast);max-width:520px;padding:var(--space-3) var(--space-4);border-radius:var(--r-md);font-size:var(--text-md);font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none}
  .invtoast.err{background:var(--neg);color:var(--ink-on-fill)} .invtoast.ok{background:var(--pos);color:var(--ink-on-fill)}
  .userchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:var(--space-1) var(--space-3)}
  .userchip b{color:var(--ink)} .userchip .ro{color:var(--accent);font-weight:700;letter-spacing:.03em}
  .userchip button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
  .btn.danger{background:var(--neg-soft);color:var(--neg);border-color:var(--neg)}
  .btn.danger:disabled{opacity:.45;cursor:not-allowed}

/* src/shell/viewkit.css: the view kit's CSS (SPEC-v3.40-tracker-views-r1.md clause 3.2, R-4). Composed into the page's
   inline shell CSS right after ui.css, under the same scale rule (build-deploy.mjs refuses a font-size, padding, margin,
   gap or border-radius that is not a scale step, and any literal colour). Every rule is scoped to a `vk-` class, so no
   selector the equivalence smoke captures (test/fixtures/equivalence/styles.json) and no bare tag is styled here
   (test/shell-viewkit.test.mjs K8). Row heights come from the two tokens --row-compact and --row-comfortable
   (tokens.css), chosen by the nearest [data-density]; colours from the tokens, so dark mode follows them. Under 720 px
   the strip goes two by two and table rows stack into cards (D81-D). Plain characters only. */
  .vk-ctx{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);
    padding:var(--space-2) 0;margin:0 0 var(--space-3)}
  .vk-ctx-start,.vk-ctx-end{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}
  .vk-ctl{display:inline-flex;align-items:center;gap:var(--space-2)}
  .vk-lbl{font-size:var(--text-xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .vk-seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px}
  .vk-seg-btn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:var(--text-sm);font-weight:600;
    padding:var(--space-1) var(--space-3);border-radius:var(--r-xs);cursor:pointer;white-space:nowrap}
  .vk-seg-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .vk-seg-btn:focus-visible,.vk-btn:focus-visible,.vk-select:focus-visible,.vk-drawer-btn:focus-visible,
  .vk-disclosure:focus-visible,.vk-tab:focus-visible,.vk-side-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .vk-select{font:inherit;font-size:var(--text-sm);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);
    border-radius:var(--r-xs);padding:var(--space-1) var(--space-2)}
  .vk-btn{font:inherit;font-size:var(--text-sm);font-weight:600;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:var(--space-1) var(--space-3);cursor:pointer;white-space:nowrap}
  .vk-btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .vk-note{font-size:var(--text-sm);color:var(--muted)}

  .vk-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);margin:0 0 var(--space-3)}
  .vk-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--space-3) var(--space-4)}
  .vk-stat-label{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .vk-stat-value{font-size:var(--text-xl);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin:var(--space-1) 0 0}
  .vk-stat-basis{font-size:var(--text-xs);color:var(--muted);margin:var(--space-1) 0 0}

  .vk-drawer-btn{font:inherit;font-size:var(--text-sm);font-weight:600;color:var(--accent);background:transparent;border:0;
    padding:var(--space-1) 0;cursor:pointer}
  .vk-drawer{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--space-3) var(--space-4);
    margin:0 0 var(--space-3)}
  .vk-drawer[hidden]{display:none}
  .vk-drawer-title{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 var(--space-2)}
  .vk-drawer-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-2) var(--space-4)}
  .vk-metric-label{font-size:var(--text-xs);color:var(--muted)}
  .vk-metric-value{font-size:var(--text-md);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .vk-memo{display:inline-block;font-size:var(--text-xs);color:var(--muted);border:1px solid var(--line);border-radius:var(--r-pill);
    padding:0 var(--space-2);margin:var(--space-1) 0 0}

  .vk-table-wrap{overflow:auto;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
  .vk-table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--text-sm);font-variant-numeric:tabular-nums;color:var(--ink)}
  .vk-table .vk-th{position:sticky;top:0;z-index:var(--z-sticky);background:var(--surface);text-align:left;font-size:var(--text-xs);
    font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 var(--space-3);
    height:var(--row-compact);border-bottom:1px solid var(--line-strong);white-space:nowrap}
  .vk-table .vk-cell{padding:0 var(--space-3);height:var(--row-compact);border-bottom:1px solid var(--line);white-space:nowrap}
  [data-density="comfortable"] .vk-table .vk-cell,[data-density="comfortable"] .vk-table .vk-th{height:var(--row-comfortable)}
  .vk-table .vk-num{text-align:right}
  .vk-table .vk-sticky{position:sticky;left:0;background:var(--surface);z-index:1}
  .vk-table .vk-th.vk-sticky{z-index:calc(var(--z-sticky) + 1)}
  .vk-table .vk-current{background:var(--accent-soft)}
  .vk-table .vk-section .vk-cell{background:var(--surface-2);font-weight:700}
  .vk-disclosure{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:0;padding:0;cursor:pointer}
  .vk-disclosure[aria-expanded="false"]{color:var(--muted)}
  .vk-table .vk-total .vk-cell{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:0;background:var(--surface-2)}
  .vk-table .vk-row[hidden]{display:none}

  .vk-side-root{position:relative}
  .vk-scrim{position:fixed;inset:0;background:rgba(20,17,46,.32);z-index:var(--z-pop)}
  .vk-side{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--surface);border-left:1px solid var(--line);
    box-shadow:var(--shadow);z-index:calc(var(--z-pop) + 1);display:flex;flex-direction:column;overflow:auto}
  .vk-scrim[hidden],.vk-side[hidden]{display:none}
  .vk-side-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);
    border-bottom:1px solid var(--line)}
  .vk-side-title{font-size:var(--text-lg);font-weight:700;color:var(--ink)}
  .vk-side-close{font:inherit;font-size:var(--text-sm);color:var(--ink);background:transparent;border:1px solid var(--line-strong);
    border-radius:var(--r-sm);padding:var(--space-1) var(--space-2);cursor:pointer}
  .vk-side-body{padding:var(--space-3) var(--space-4)}

  .vk-notice{font-size:var(--text-sm);border-radius:var(--r-sm);padding:var(--space-2) var(--space-3);margin:0 0 var(--space-3);
    border:1px solid var(--line)}
  .vk-notice[hidden]{display:none}
  .vk-notice-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-bar)}
  .vk-notice-empty{background:var(--surface-2);color:var(--muted)}
  .vk-notice-error{background:var(--neg-soft);color:var(--neg-strong);border-color:var(--neg)}

  .vk-tablist{display:flex;gap:var(--space-1);border-bottom:1px solid var(--line);margin:0 0 var(--space-3)}
  .vk-tab{font:inherit;font-size:var(--text-sm);font-weight:600;color:var(--muted);background:transparent;border:0;
    border-bottom:2px solid transparent;padding:var(--space-2) var(--space-3);cursor:pointer}
  .vk-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .vk-tabpanel[hidden],.vk-tabs[hidden]{display:none}

  /* v3.41a (SPEC-v3.41 clause 3.2, R-3): the strip's delta, the bar's menu and slot, chips, the Filters button, the
     status pill (the native select itself), sub-tabs and the phone card list */
  .vk-stat-delta{font-size:var(--text-xs);font-weight:600;color:var(--muted);margin:var(--space-1) 0 0;font-variant-numeric:tabular-nums}
  .vk-stat-delta.vk-delta-pos{color:var(--pos)}
  .vk-stat-delta.vk-delta-neg{color:var(--neg)}
  .vk-stat-delta[hidden]{display:none}
  .vk-ctl-menu{position:relative}

  *{box-sizing:border-box}

  /* -- v3.27 (V3.2, defect 1): the Users roster's Level / Scope selects ----------------------
     `#um` carries the `wiz` class, so `.wiz select{width:100%}` applied to the two selects inside
     the roster's narrow table cells and clipped them to about 53px - "adm...", "gro...". The rule was
     written for the wizard's full-width form fields and the roster is a table. Sized to content
     here, and `min-width:0` so a long option label cannot re-inflate the column instead. */
  .wiz .jmtbl select.umf{width:auto;min-width:0;padding:4px 6px}

  #ovl button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:650;cursor:pointer}
  #ovl button:disabled{opacity:.6;cursor:default}
  #ovl .msg{font-size:13px;margin-top:14px;color:var(--muted)}

    background:#fff;color:#3c4043;border:1px solid #dadce0;font-weight:600}
