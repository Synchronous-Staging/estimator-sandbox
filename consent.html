// src/shell/sdk-loader.js (v3.32, SPEC-v3.32-shell-proper.md clauses 6.1 and 10.2): NOT a module. The exact text of the
// legacy page's loadSDK() (budget-app.html v3.31.1, lines 17604 to 17610, the two-space indentation kept), which the build
// inlines VERBATIM into the prelude of the shell script element, so loadSDK is a page global. Its lines 2 to 6 are the
// canonical SRI block (build-deploy.mjs SDK.block, exactly once here, SDK.loaderCounts); nothing else on the page or in

function loadSDK(){ return new Promise((res,rej)=>{ if(window.supabase)return res();
  const s=document.createElement('script');
  // pinned version + SRI: the CDN cannot silently swap the code that runs inside a signed-in finance session
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.min.js';

// src/consent/consent.js (v3.43, SPEC-v3.43-claude-connector.md clause 3.5, lane P): the OAuth consent page's logic.
// Supabase Auth's OAuth 2.1 server sends the person here (Site URL plus /consent.html) with ?authorization_id=<id>. This
// page: (1) reads the id and nothing else from the query (a missing id: it says so and stops); (2) makes sure the person
// is signed in, by the shell's TWO methods and no other (signin.js: the magic link with shouldCreateUser false, and
// Google; there is no password sign-in, G-6), each redirecting back to THIS page with its query, so the person lands on
// the same authorisation; (3) asks the SDK for the authorisation's details (an id that does not resolve, or a client
// that is not one of the connector's, is refused and nothing is offered); (4) reads the person's own members row (RLS:
// own row by e-mail; none: "you are not on the access list for this tool" and Deny only); (5) shows who Claude would act
// as, with Approve and Deny, each following the redirect URL the SDK RETURNS, never one from the query.
// D134 (3 Nov 2026): any platform member may connect; there is no connector key check on this page.
// Review round 4 (Codex r1, P2): the person shown is the one the authorisation is BOUND to (the details' user, whose
// token the SDK sent when it asked), never an earlier getSession() read; the session is read again immediately before
// Approve or Deny (and before an earlier consent's redirect is followed) and must still be that person; and a sign-in
// change while the page is open (another tab signing someone else in, or out) withdraws the decision. As far as the
// browser can check, the page never sends a decision for anyone but the person shown (N8, N16). The server is the last
// check: auth-js reads the session again for the consent POST itself (N6, to be confirmed at the staging E2E).
// Review round 5 (R5-1, P2): each button's handler holds its own element ("not you?" read a shared variable at click time,
// null by then, so it threw and signed no one out; the magic link disabled Google's button, N1). One decision at a time:
// Approve and Deny both go off while one is sent, and sbaConsentDecide sends no second (N2). A sign-in change while the
// page is still loading (before any view carries uid) makes that load stale, shown as changed (N3; N5 with it).
// Review round 6 (R6-1, P2): the address a sign-in comes back to is the page's own (origin, path and the authorisation
// id), built at boot before the SDK loads and again by each sign-in method; never location.href, which after a sign-in
// return still carries the implicit flow's #access_token=...&refresh_token=... (or an expired link's #error=...), so
// "not you?" and a new sign-in sent the old session's tokens as redirect_to. Once auth-js has read a return from the
// address (while it initialises), the address bar is set to that clean address. N12: a decision follows its redirect,
// or shows its error, only while the view it was sent from is still on screen, and "not you?" turns the decision buttons
// off first. N14: a
// sign-in method that throws gives its button back with the error; a redirect the browser refuses says so. N13: a
// sign-out that fails and keeps the session says so.
//
// NOT a module: build-deploy.mjs (lib/consent-page.mjs) inlines this file VERBATIM into consent.html after the prelude
// (SBA_ENV and the pinned SDK loader, src/shell/sdk-loader.js). It creates no element and no script (the SRI pins on
// consent.html count the loader's tokens only). Everything the logic touches is injected, so test/consent.test.mjs runs
// sbaConsentRun in node:vm with a stubbed sb. Plain characters only (non-ASCII in strings as \u escapes).

// the connector's OAuth clients, by the names Tom registers them under (spec 3.1); every other client is refused
var SBA_CONSENT_CLIENTS = ['SBA Platform (Claude)', 'SBA Platform (Claude Code)'];

function sbaConsentEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;'); }

// the authorisation id: the one thing this page takes from the query
function sbaConsentId(search) {
  var m = /[?&]authorization_id=([^&#]*)/.exec(String(search || ''));
  var id = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')).trim() : '';
  return /^[A-Za-z0-9._-]{1,128}$/.test(id) ? id : '';
}

// R6-1: the page's own address, the one a sign-in comes back to: everything before the query (the origin and the path)
// and the authorisation id as the only parameter. Never the fragment (a sign-in return's tokens, an expired link's
// error), and nothing else from the query.
function sbaConsentBack(href) {
  var s = String(href || '').split('#')[0];
  var q = s.indexOf('?');
  var id = sbaConsentId(q < 0 ? '' : s.slice(q));
  return (q < 0 ? s : s.slice(0, q)) + (id ? '?authorization_id=' + encodeURIComponent(id) : '');
}

// the views a member row holds, as the app reads them (an array of keys; anything else is none)
function sbaConsentViews(row) { return row && Array.isArray(row.views) ? row.views.filter(function (v) { return typeof v === 'string'; }) : []; }

// review round 1, R1-11: true when this page is not the top window (a frame), or when the top cannot even be read (a
// cross-origin parent). GitHub Pages cannot send frame-ancestors, so the page refuses itself inside a frame: a hostile
// page could otherwise frame it for a signed-in member and lay its own overlay over Approve.
function sbaConsentFramed(w) {
  try { return w.top !== w.self; } catch (e) { return true; }
}

// a user as the page holds one: { id, email (lower-cased) }, or null when either is missing
function sbaConsentWho(u) {
  return u && typeof u.id === 'string' && u.id && typeof u.email === 'string' && u.email ? { id: u.id, email: u.email.toLowerCase() } : null;
}
// who is signed in to this browser NOW (the SDK reads its storage on every call, so another tab's sign-in shows here)
async function sbaConsentUser(D) {
  var s = null;
  try { s = await D.sb.auth.getSession(); } catch (e) { return null; }
  return sbaConsentWho(s && s.data && s.data.session && s.data.session.user);
}
// R4: true only when the person signed in now is the one the view was drawn for
async function sbaConsentSame(D, uid) {
  var u = await sbaConsentUser(D);
  return !!(u && uid && u.id === uid);
}
var SBA_CONSENT_CHANGED = { kind: 'changed' };
// every view goes through here, so D.cur is the view on screen (the sign-in listener reads it)
function sbaConsentShow(D, v) { D.cur = v; D.show(v); return v; }
// R4: one listener for the page's life; a view bound to a person (v.uid) is withdrawn when the signed-in person changes
function sbaConsentWatch(D) {
  if (D.watching || !D.sb.auth.onAuthStateChange) return;
  D.watching = true;
  D.sb.auth.onAuthStateChange(function (event, session) { sbaConsentOnAuth(D, session); });
}
function sbaConsentOnAuth(D, session) {
  var u = sbaConsentWho(session && session.user);
  // R5 (N3): while a run loads, an event naming anyone but the person it read (or no one) makes that run stale
  if (D.base && !(u && u.id === D.base)) D.gen = (D.gen || 0) + 1;
  var v = D.cur;
  if (!v || !v.uid) return;
  if (u && u.id === v.uid) return;
  sbaConsentShow(D, SBA_CONSENT_CHANGED);
}

// sbaConsentRun(D): the page's flow. D = { sb, href, search, assign(url), show(view), framed }. Resolves to the last view
// shown. D.framed (sbaConsentFramed(window) in the browser) stops the page before it asks the server anything (R1-11).
// A view is { kind, ... }; sbaConsentHtml(view) draws it and sbaConsentBind wires its buttons. A view that offers a
// decision carries uid, the id of the person it was drawn for (R4). R5 (N3): g is the sign-in generation when this run
// began; if the listener moved it while the run loaded, the run shows changed instead of what it loaded.
async function sbaConsentRun(D) {
  var g = D.gen || 0;
  D.base = '';
  var show = function (v) { return sbaConsentShow(D, (D.gen || 0) !== g ? SBA_CONSENT_CHANGED : v); };
  if (D.framed) return show({ kind: 'framed' });
  var id = sbaConsentId(D.search);
  if (!id) return show({ kind: 'no-id' });
  sbaConsentWatch(D);
  var me = await sbaConsentUser(D);
  if (!me) return show({ kind: 'signin', id: id });
  D.base = me.id;
  var det = null;
  try { det = await D.sb.auth.oauth.getAuthorizationDetails(id); } catch (e) { det = { data: null, error: e }; }
  if (!det || det.error || !det.data) return show({ kind: 'refused', email: me.email, why: 'This authorisation request could not be read: ' + sbaConsentErr(det && det.error) + '. Start the connection again from Claude.' });
  var d = det.data;
  // an earlier consent: the server answers with the redirect at once (the client was checked when it was given)
  var already = typeof d.authorization_id !== 'string' && typeof d.redirect_url === 'string';
  var client = d.client && typeof d.client.name === 'string' ? d.client.name : '';
  if (!already && SBA_CONSENT_CLIENTS.indexOf(client) < 0) return show({ kind: 'refused', email: me.email, why: 'This request comes from an app that is not the SBA Platform connector (' + (client || 'no name') + '). Nothing has been shared.' });
  // R4: the person shown is the one the authorisation is bound to; an earlier consent names no one, so it keeps the
  // session read above and is re-checked before its redirect is followed
  var who = already ? me : sbaConsentWho(d.user);
  if (!who) return show({ kind: 'refused', email: me.email, why: 'This authorisation request does not say who it is for. Nothing has been shared. Start the connection again from Claude.' });
  var email = who.email;
  var mem = null;
  try { mem = await D.sb.from('members').select('role,scope,views').eq('email', email).maybeSingle(); } catch (e) { mem = { data: null, error: e }; }
  if (!mem || mem.error) return show({ kind: 'deny-only', id: id, uid: who.id, email: email, why: 'Your access could not be read: ' + sbaConsentErr(mem && mem.error) + '. Try again, or deny.' });
  if (!mem.data) return show({ kind: 'deny-only', id: id, uid: who.id, email: email, why: 'you are not on the access list for this tool' });
  if (already) {
    // R1-11: the same http(s) rule Approve and Deny apply (sbaConsentDecide); anything else goes nowhere
    if (!/^https?:\/\//i.test(d.redirect_url)) return show({ kind: 'error', why: 'The earlier approval came back without a usable address. Start the connection again from Claude.' });
    if (!(await sbaConsentSame(D, who.id))) return show(SBA_CONSENT_CHANGED);   // R4
    if ((D.gen || 0) !== g) return show(SBA_CONSENT_CHANGED);   // R5 (N3, N5): someone else signed in while it loaded
    if (!sbaConsentGo(D, d.redirect_url)) return D.cur;   // N14
    return show({ kind: 'leaving', email: email });
  }
  var row = mem.data;
  return show({ kind: 'ask', id: id, uid: who.id, email: email, client: client, role: String(row.role || ''), scope: String(row.scope || ''), views: sbaConsentViews(row) });
}

function sbaConsentErr(e) { return e && e.message ? String(e.message) : 'no answer'; }

// N14: follow a redirect; a browser that refuses it (location.assign throws) shows why, instead of dead buttons
function sbaConsentGo(D, to) {
  try { D.assign(to); return true; } catch (e) { sbaConsentShow(D, { kind: 'error', why: 'This page could not return you to Claude: ' + sbaConsentErr(e) + '. Start the connection again from Claude.' }); return false; }
}

// the decisions: Approve and Deny call the SDK with skipBrowserRedirect and follow the URL IT returns. v is the view the
// button was on. R4: the session is read again first; anyone but the person v was drawn for (or no one) signed in now
// stops it, and nothing is sent. R5 (N2): one decision at a time; a second while the first is being sent sends nothing.
async function sbaConsentDecide(D, v, approve) {
  if (D.deciding) return null;   // N2: the first decision is still on its way
  D.deciding = true;
  try { return await sbaConsentSend(D, v, approve); } finally { D.deciding = false; }
}
async function sbaConsentSend(D, v, approve) {
  var id = v && v.id;
  if (!v || !(await sbaConsentSame(D, v.uid))) { sbaConsentShow(D, SBA_CONSENT_CHANGED); return null; }
  var r = null;
  var fn = approve ? 'approveAuthorization' : 'denyAuthorization';
  var at = D.cur;   // N12: the view on screen as the decision is sent
  try { r = await D.sb.auth.oauth[fn](id, { skipBrowserRedirect: true }); } catch (e) { r = { data: null, error: e }; }
  if (D.cur !== at) return null;   // N12: the page has moved on while it was sent ("not you?", another account); leave it there
  var to = r && !r.error && r.data && typeof r.data.redirect_url === 'string' ? r.data.redirect_url : '';
  if (!/^https?:\/\//i.test(to)) { sbaConsentShow(D, { kind: 'error', why: (approve ? 'Approve' : 'Deny') + ' did not complete: ' + sbaConsentErr(r && r.error) + '. Start the connection again from Claude.' }); return null; }
  if (!sbaConsentGo(D, to)) return null;   // N14
  sbaConsentShow(D, { kind: 'leaving' });
  return to;
}

// the sign-in: the shell's two methods, each back to THIS page with the authorisation id (R6-1: sbaConsentBack, never a
// fragment or another parameter)
async function sbaConsentMagic(D, email) {
  var e = String(email || '').trim();
  if (!e) return { error: { message: 'enter your work email' } };
  var r = await D.sb.auth.signInWithOtp({ email: e, options: { emailRedirectTo: sbaConsentBack(D.href), shouldCreateUser: false } });
  return r || {};
}
async function sbaConsentGoogle(D) {
  var r = await D.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: sbaConsentBack(D.href) } });
  return r || {};
}

var SBA_CONSENT_LOGO = '<svg class="logo" viewBox="0 0 100 116" role="img" aria-label="Synchronous Group"><defs><linearGradient id="sgrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F58A46"/><stop offset="0.35" stop-color="#EC2C86"/><stop offset="0.68" stop-color="#4E4A9E"/><stop offset="1" stop-color="#29ABE2"/></linearGradient></defs><path d="M50 5 L95 31 L95 85 L50 111 L5 85 L5 31 Z" fill="none" stroke="url(#sgrad)" stroke-width="8" stroke-linejoin="round"/><path class="bar" d="M33 84 L33 68"/><path class="bar" d="M50 84 L50 54"/><path class="bar" d="M67 84 L67 40"/></svg>';

// sbaConsentHtml(view): the card's HTML for a view; every value from the server or the person is escaped
function sbaConsentHtml(v) {
  var h = SBA_CONSENT_LOGO + '<h1>Connect Claude to the SBA Platform</h1>';
  var who = v.email ? '<p class="muted">Signed in as <b>' + sbaConsentEsc(v.email) + '</b> <button type="button" class="link" id="cSignOut">not you?</button></p>' : '';
  if (v.kind === 'framed') return h + '<p class="msg" role="alert">This page cannot be used inside a frame. Open the connection from Claude in its own window.</p>';
  if (v.kind === 'no-id') return h + '<p class="msg" role="alert">This page needs an authorisation request from Claude, and none came with it. Start the connection again from Claude.</p>';
  if (v.kind === 'signin') return h + '<p>Sign in with your platform login to continue.</p>'
    + '<button type="button" id="cGoogle" class="btn">Continue with Google</button>'
    + '<div class="odiv">or sign in with your work email</div>'
    + '<input id="cEmail" type="email" placeholder="you@syncba.com.au" autocomplete="email">'
    + '<button type="button" id="cMagic" class="btn primary">Send sign-in link</button><p class="msg" id="cMsg" role="status"></p>';
  if (v.kind === 'refused') return h + who + '<p class="msg" role="alert">' + sbaConsentEsc(v.why) + '</p>';
  if (v.kind === 'deny-only') return h + who + '<p class="msg" role="alert">' + sbaConsentEsc(v.why) + '</p>'
    + '<div class="row"><button type="button" id="cDeny" class="btn">Deny</button></div><p class="msg" id="cMsg" role="status"></p>';
  if (v.kind === 'ask') {
    var views = v.views.length ? v.views.join(', ') : 'no views';
    return h + who + '<p><b>' + sbaConsentEsc(v.client) + '</b> is asking to connect.</p>'
      + '<p class="ask">Claude would like to use the SBA Platform as <b>' + sbaConsentEsc(v.email) + '</b> (' + sbaConsentEsc(v.role) + ', ' + sbaConsentEsc(v.scope) + ', ' + sbaConsentEsc(views) + ')</p>'
      + '<p class="muted">Claude can then do what you can do in the app and nothing more. You can disconnect it at any time from Connected apps in the app.</p>'
      + '<div class="row"><button type="button" id="cDeny" class="btn">Deny</button><button type="button" id="cApprove" class="btn primary">Approve</button></div><p class="msg" id="cMsg" role="status"></p>';
  }
  if (v.kind === 'changed') return h + '<p class="msg" role="alert">The account signed in to this browser changed while this page was open. Nothing was approved or denied. Reload this page to continue as the account signed in now.</p>';
  if (v.kind === 'leaving') return h + '<p class="muted">Returning you to Claude\u2026</p>';
  if (v.kind === 'error') return h + '<p class="msg" role="alert">' + sbaConsentEsc(v.why) + '</p>';
  return h + '<p class="muted">Loading\u2026</p>';
}

// sbaConsentBind(root, D, v): wires the buttons a view drew (in the browser only). R5-1: each handler holds its OWN
// element, looked up once here; none reads a variable that a later lookup reassigns.
function sbaConsentBind(root, D, v) {
  var q = function (sel) { return root.querySelector(sel); };
  var msg = function (t) { var m = q('#cMsg'); if (m) m.textContent = t; };
  var out = q('#cSignOut'), ok = q('#cApprove'), no = q('#cDeny'), magic = q('#cMagic'), google = q('#cGoogle'), inp = q('#cEmail');
  // "not you?": sign out, then run again (no session now: the sign-in view); the one listener stays as it is. N12: the
  // decision buttons go off first, so no decision is started while the sign-out is on its way
  // N13: a sign-out that answers an error (and so keeps the session) is said on the view the re-run draws, below
  if (out) out.onclick = async function () { out.disabled = true; if (ok) ok.disabled = true; if (no) no.disabled = true;
    try { var so = await D.sb.auth.signOut(); D.outErr = so && so.error; } catch (e) { D.outErr = e; } await sbaConsentRun(D); };
  if (D.outErr) { var oe = D.outErr; D.outErr = null; if (v.kind !== 'signin') msg('Signing out did not work: ' + sbaConsentErr(oe) + '. Try again, or close this page.'); }
  // N2: Approve and Deny are one decision; both go off before it is sent
  var decide = function (approve) {
    if (D.deciding) return null;
    if (ok) ok.disabled = true;
    if (no) no.disabled = true;
    msg(approve ? 'Approving\u2026' : 'Denying\u2026');
    return sbaConsentDecide(D, v, approve);
  };
  if (ok) ok.onclick = function () { return decide(true); };
  if (no) no.onclick = function () { return decide(false); };
  if (magic) {
    var send = async function () {
      if (magic.disabled) return;   // N1: Enter while a send is on its way sends nothing more
      magic.disabled = true; msg('Sending\u2026');
      var r;
      try { r = await sbaConsentMagic(D, inp && inp.value); } catch (e) { r = { error: { message: sbaConsentErr(e) } }; }   // N14
      msg(r.error ? 'Error: ' + r.error.message : 'Check your email for the sign-in link. It brings you back to this page.'); magic.disabled = false; };
    magic.onclick = send; if (inp) inp.onkeydown = function (e) { if (e.key === 'Enter') send(); };
  }
  if (google) google.onclick = async function () { google.disabled = true; msg('Opening Google sign-in\u2026');
    var r;
    try { r = await sbaConsentGoogle(D); } catch (e) { r = { error: { message: sbaConsentErr(e) } }; }   // N14
    if (r.error) { msg(/not enabled|unsupported provider|validation_failed/i.test(r.error.message) ? "Google sign-in isn't switched on yet \u2014 use your work email below." : 'Error: ' + r.error.message); google.disabled = false; } };
}

// the boot, in the browser only (the prelude defines SBA_ENV and loadSDK)
async function sbaConsentBoot() {
  var root = document.getElementById('consent');
  // R6-1: the address back to this page is built here, before the SDK loads, and is never location.href itself
  var D = { sb: null, href: sbaConsentBack(location.href), search: location.search, framed: sbaConsentFramed(window), assign: function (u) { location.assign(u); },
    show: function (v) { root.innerHTML = sbaConsentHtml(v); sbaConsentBind(root, D, v); } };
  if (D.framed) { D.show({ kind: 'framed' }); return; }   // R1-11: before the SDK loads or anything is asked
  try { await loadSDK(); } catch (e) { D.show({ kind: 'error', why: "Couldn't load the sign-in library. Check your connection and reload." }); return; }   // eslint-disable-line no-undef
  D.sb = window.supabase.createClient(SBA_ENV.sb_url, SBA_ENV.sb_key);   // eslint-disable-line no-undef
  await sbaConsentTidy(D);
  await sbaConsentRun(D);
}
// R6-1: auth-js reads a sign-in return from the address while it initialises (and clears the fragment itself only when the
// sign-in worked), so the address bar is set to the page's own address only after that, never before: earlier, auth-js
// would not see the tokens. No token or error is then left in the address bar or its history entry.
async function sbaConsentTidy(D) {
  try {
    if (typeof D.sb.auth.initialize !== 'function') return;
    await D.sb.auth.initialize();
    if (location.href !== D.href) history.replaceState(history.state, '', D.href);   // eslint-disable-line no-undef
  } catch (e) { /* the address bar keeps what it had */ }
}
if (typeof window !== 'undefined' && typeof document !== 'undefined' && typeof SBA_ENV !== 'undefined') sbaConsentBoot();   // eslint-disable-line no-undef
</script>
</body>
</html>
